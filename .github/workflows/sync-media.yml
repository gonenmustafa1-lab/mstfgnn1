name: TV1 daily free-stream refresh

on:
  schedule:
    - cron: "35 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh free sports and Turkish channels
        run: python scripts/sync_media.py
      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spor.m3u tv-ekstra.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified free sports and Turkish TV playlists"
            git push
          fi
