name: Build Mustafa TV for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "mustafa-tv/**"
      - ".github/workflows/build-mustafa-tv.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mustafa-tv/package.json
      - name: Install dependencies
        working-directory: mustafa-tv
        run: npm install
      - name: Build Windows installer and portable EXE
        working-directory: mustafa-tv
        run: npm run dist
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Mustafa-TV-Windows
          path: mustafa-tv/dist/*.exe
          if-no-files-found: error
          retention-days: 30
